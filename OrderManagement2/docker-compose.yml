services:
  app:
    build: .
    ports:
      - "8090:8080"
    networks:
      - my-network

  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: RootAdmin123
      MYSQL_DATABASE: docker
      MYSQL_USER: student
      MYSQL_PASSWORD: RootPass123
    ports:
      - "3307:3306"
    networks:
      - my-network
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

networks:
  my-network:
    driver: bridge